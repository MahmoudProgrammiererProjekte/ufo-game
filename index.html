<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Raketen-Spiel</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0b2233;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }

    /* === أزرار التحكم الكبيرة والواضحة للموبايل === */
    #controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 100;
    }
    .btn {
      background: rgba(30, 144, 255, 0.85);
      color: white;
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      width: 65px;
      height: 65px;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }
    .btn:active { 
      background: rgba(0, 80, 180, 0.95); 
      transform: scale(0.9); 
    }

    /* زر الإطلاق مميز بلون مختلف */
    #fireBtn {
      background: rgba(220, 20, 60, 0.85);
    }
    #fireBtn:active {
      background: rgba(160, 0, 30, 0.95);
    }

    /* إخفاء الأزرار على أجهزة الكمبيوتر */
    @media (min-width: 768px) { 
      #controls { display: none; } 
    }
  </style>
</head>
<body>

  <!-- الأزرار الواضحة والكبيرة -->
  <div id="controls">
    <button class="btn" id="leftBtn">◀</button>
    <button class="btn" id="upBtn">▲</button>
    <button class="btn" id="downBtn">▼</button>
    <button class="btn" id="rightBtn">▶</button>
    <button class="btn" id="fireBtn">🔥</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
  <script src="app.js"></script>

  <!-- ربط الأزرار بمحاكاة الكيبورد عشان app.js ما يتأثر -->
  <script>
    (function() {
      const keyMap = {
        'leftBtn': 'ArrowLeft',
        'upBtn': 'ArrowUp',
        'downBtn': 'ArrowDown',
        'rightBtn': 'ArrowRight',
        'fireBtn': ' '
      };

      function simulateKey(key, type) {
        const event = new KeyboardEvent(type, {
          key: key === ' ' ? ' ' : key,
          code: key === ' ' ? 'Space' : key,
          bubbles: true
        });
        window.dispatchEvent(event);
      }

      Object.keys(keyMap).forEach(id => {
        const btn = document.getElementById(id);
        const key = keyMap[id];
        if (!btn) return;

        const start = (e) => {
          e.preventDefault();
          simulateKey(key, 'keydown');
        };

        const end = (e) => {
          e.preventDefault();
          simulateKey(key, 'keyup');
        };

        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointerleave', end);
        btn.addEventListener('pointercancel', end);
      });
    })();
  </script>
</body>
</html>
