<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Raketen-Spiel</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0b2233; touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; width: 100vw; height: 100vh; }
    #mobile-hud { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
    #joystick-container { position: absolute; bottom: 65px; left: 20px; width: 110px; height: 110px; background: rgba(255, 255, 255, 0.15); border: 3px solid rgba(255, 255, 255, 0.4); border-radius: 50%; pointer-events: auto; touch-action: none; backdrop-filter: blur(4px); }
    #joystick-stick { position: absolute; top: 50%; left: 50%; width: 45px; height: 45px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    #pubg-fire-btn { position: absolute; bottom: 65px; right: 20px; width: 90px; height: 90px; background: radial-gradient(circle, rgba(235, 59, 90, 0.95) 0%, rgba(193, 15, 47, 0.95) 100%); border: 3px solid rgba(255, 255, 255, 0.8); border-radius: 50%; color: white; font-size: 16px; font-weight: bold; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; }
    #pubg-fire-btn:active { transform: scale(0.9); }
    @media (min-width: 1025px) { #mobile-hud { display: none; } }
  </style>
</head>
<body>
  <div id="mobile-hud">
    <div id="joystick-container"><div id="joystick-stick"></div></div>
    <div id="pubg-fire-btn">FEUER</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
  <script>
    document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd <= 300) e.preventDefault(); lastTouchEnd = now; }, { passive: false });

    const app = new PIXI.Application({
        width: window.innerWidth, height: window.innerHeight, backgroundColor: 0x0b2233,
        resolution: Math.min(window.devicePixelRatio || 1, 1.5), autoDensity: true, powerPreference: 'high-performance', antialias: false
    });
    document.body.appendChild(app.view);

    let isMobileScreen = window.innerWidth <= 768;
    window.addEventListener("resize", () => { app.renderer.resize(window.innerWidth, window.innerHeight); isMobileScreen = window.innerWidth <= 768; });
    const getScale = base => isMobileScreen ? base * 0.75 : base;

    const ASSETS = { rocket: "rocket.png", bullet: "bullet.png", ufo1: "ufo1.png", ufo2: "ufo2.png", explosionSound: "explosion.mp3", hitSound: "hit.mp3", shootSound: "shoot.mp3" };
    const audio = { explosion: new Audio(ASSETS.explosionSound), hit: new Audio(ASSETS.hitSound), shoot: new Audio(ASSETS.shootSound) };
    function playSound(s) { try { s.currentTime = 0; s.play().catch(()=>{}); } catch(e){} }

    let rocket = null, bullets = [], ufos = [], ufoBullets = [], explosions = [];
    let keys = {}, gameRunning = false, ufoTimer = 0, score = 0, levelIndex = 0, levelStartTime = 0, lastSpaceShoot = 0, currentEnterAction = null;
    const LEVELS = [{ target: 30, durationSec: 60 }, { target: 60, durationSec: 75 }, { target: 100, durationSec: 90 }];

    const ui = {
        scoreText: new PIXI.Text("", { fill: "white", fontSize: 18, fontWeight: "bold" }),
        levelText: new PIXI.Text("", { fill: "yellow", fontSize: 18, fontWeight: "bold" }),
        timerText: new PIXI.Text("", { fill: "lightgreen", fontSize: 18, fontWeight: "bold" }),
        messageText: new PIXI.Text("", { fill: "red", fontSize: 26, fontWeight: "bold" })
    };
    ui.scoreText.x = ui.scoreText.y = 10; ui.levelText.x = 10; ui.levelText.y = 35; ui.timerText.x = 10; ui.timerText.y = 60;
    ui.messageText.anchor.set(0.5); ui.messageText.x = app.screen.width / 2; ui.messageText.y = 120;
    app.stage.addChild(ui.scoreText, ui.levelText, ui.timerText, ui.messageText);

    const random = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);
    function destroySprite(s) { if (s) { if (s.parent) s.parent.removeChild(s); s.destroy({ children: true }); } }

    function createButton(text, x, y, w, h, onClick) {
        const c = new PIXI.Container();
        const g = new PIXI.Graphics();
        g.beginFill(0x3333aa).drawRoundedRect(0, 0, w, h, 12).endFill();
        g.interactive = true; g.buttonMode = true; g.on("pointerdown", onClick);
        c.addChild(g);
        const t = new PIXI.Text(text, { fill: "white", fontSize: 18, fontWeight: "bold" });
        t.x = w / 2 - t.width / 2; t.y = h / 2 - t.height / 2;
        c.addChild(t); c.x = x - w / 2; c.y = y - h / 2;
        return c;
    }

    function createRocket() {
        if (rocket) destroySprite(rocket);
        rocket = PIXI.Sprite.from(ASSETS.rocket);
        rocket.anchor.set(0.5); rocket.x = app.screen.width / 2; rocket.y = app.screen.height - (isMobileScreen ? 180 : 120);
        rocket.scale.set(getScale(0.1));
        app.stage.addChild(rocket);
    }

    function shootBullet() {
        if (!gameRunning || !rocket) return;
        const b = PIXI.Sprite.from(ASSETS.bullet);
        b.anchor.set(0.5); b.x = rocket.x; b.y = rocket.y - 35; b.scale.set(getScale(0.06));
        bullets.push(b); app.stage.addChild(b);
        playSound(audio.shoot);
    }

    function shootUFOBullet(ufoX, ufoY) {
        if (!gameRunning) return;
        const b = PIXI.Sprite.from(ASSETS.bullet);
        b.anchor.set(0.5); b.x = ufoX; b.y = ufoY + 25; b.rotation = Math.PI; b.scale.set(getScale(0.05));
        app.stage.addChild(b); ufoBullets.push(b);
    }

    function explodeAt(x, y) {
        const g = new PIXI.Graphics();
        g.beginFill(0xff3333).drawCircle(0, 0, isMobileScreen ? 25 : 35).endFill();
        g.beginFill(0xffaa00).drawCircle(0, 0, isMobileScreen ? 15 : 22).endFill();
        g.x = x; g.y = y; app.stage.addChild(g);
        explosions.push({ sprite: g, life: 12 });
        playSound(audio.explosion);
    }

    function spawnUFO() {
        const u = PIXI.Sprite.from(Math.random() < 0.5 ? ASSETS.ufo1 : ASSETS.ufo2);
        u.anchor.set(0.5); u.x = random(40, app.screen.width - 40); u.y = -40; u.scale.set(getScale(0.12));
        u.lastShootTime = performance.now();
        u.shootInterval = (levelIndex === 0) ? random(1000, 1600) : random(2200, 3600);
        ufos.push(u); app.stage.addChild(u);
    }

    function isCollidingFast(a, b, radius) {
        if (!a || !b) return false;
        const dx = a.x - b.x, dy = a.y - b.y;
        return (dx * dx + dy * dy) < (radius * radius);
    }

    function endLevel(won) {
        gameRunning = false;
        ui.messageText.text = won ? `Erfolg! Level ${levelIndex+1}!` : `Verloren!`;

        const restartAction = () => { cleanupBtns(); resetGame(0); };
        const nextAction = () => {
            cleanupBtns();
            if (won) {
                if (levelIndex < LEVELS.length - 1) { levelIndex++; resetGame(levelIndex); }
                else { ui.messageText.text = "Gewonnen! 🎉"; }
            } else { resetGame(levelIndex); }
        };

        const restartBtn = createButton("Neustart", app.screen.width / 2 - 80, app.screen.height / 2 + 30, 140, 50, restartAction);
        const nextBtn = createButton(won ? "Weiter" : "Wiederholen", app.screen.width / 2 + 80, app.screen.height / 2 + 30, 140, 50, nextAction);

        function cleanupBtns() {
            if (restartBtn.parent) app.stage.removeChild(restartBtn);
            if (nextBtn.parent) app.stage.removeChild(nextBtn);
            currentEnterAction = null;
        }

        currentEnterAction = nextAction;
        app.stage.addChild(restartBtn, nextBtn);
    }

    function resetGame(startLevel = 0) {
        bullets.forEach(destroySprite); ufos.forEach(destroySprite);
        ufoBullets.forEach(destroySprite); explosions.forEach(e => destroySprite(e.sprite));
        bullets = []; ufos = []; ufoBullets = []; explosions = []; keys = {}; ufoTimer = 0; score = 0;
        levelIndex = Math.max(0, Math.min(startLevel, LEVELS.length-1));
        ui.messageText.text = ""; ui.scoreText.text = `Punkte: ${score}`;
        ui.levelText.text = `Level: ${levelIndex+1} (Ziel: ${LEVELS[levelIndex].target})`;
        startGame();
    }

    function startGame() {
        gameRunning = true; currentEnterAction = null;
        createRocket();
        levelStartTime = performance.now();
        ui.scoreText.text = `Punkte: ${score}`;
        ui.levelText.text = `Level: ${levelIndex+1} (Ziel: ${LEVELS[levelIndex].target})`;
    }

    // === التحكم بأزرار الكيبورد (Enter للبدء و Space للإطلاق) ===
    document.addEventListener("keydown", e => {
        if (["Space", "Enter", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
        keys[e.code] = true;

        if (e.code === "Enter") {
            if (!gameRunning) {
                if (startButton.parent) { app.stage.removeChild(startButton); startGame(); }
                else if (currentEnterAction) { currentEnterAction(); }
            }
        }
    });
    document.addEventListener("keyup", e => keys[e.code] = false);

    const startButton = createButton("Spiel Starten", app.screen.width / 2, app.screen.height / 2, 200, 60, () => {
        if (startButton.parent) app.stage.removeChild(startButton);
        startGame();
    });
    app.stage.addChild(startButton);
    currentEnterAction = () => { if (startButton.parent) app.stage.removeChild(startButton); startGame(); };

    // === الحلقة الرئيسية للعبة ===
    app.ticker.add(() => {
        if (!gameRunning || !rocket) return;
        const now = performance.now();

        // إطلاق النار بالمسطرة (Space)
        if (keys["Space"] && now - lastSpaceShoot > 180) {
            shootBullet();
            lastSpaceShoot = now;
        }

        const speed = 3.5;
        if (keys["ArrowLeft"]) rocket.x -= speed;
        if (keys["ArrowRight"]) rocket.x += speed;
        if (keys["ArrowUp"]) rocket.y -= speed;
        if (keys["ArrowDown"]) rocket.y += speed;

        rocket.x = Math.max(30, Math.min(rocket.x, app.screen.width - 30));
        rocket.y = Math.max(80, Math.min(rocket.y, app.screen.height - (isMobileScreen ? 180 : 70)));

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 12;
            if (bullets[i].y < -20) { destroySprite(bullets[i]); bullets.splice(i, 1); }
        }

        for (let i = ufoBullets.length - 1; i >= 0; i--) {
            const ub = ufoBullets[i];
            ub.y += isMobileScreen ? 6 : 7;
            if (ub.y > app.screen.height + 20) { destroySprite(ub); ufoBullets.splice(i, 1); continue; }
            if (rocket && isCollidingFast(ub, rocket, 25)) {
                explodeAt(rocket.x, rocket.y); destroySprite(rocket); rocket = null; gameRunning = false; endLevel(false); return;
            }
        }

        for (let i = ufos.length - 1; i >= 0; i--) {
            const u = ufos[i];
            u.y += isMobileScreen ? 2.5 : 3.2;
            if (u.y > app.screen.height + 40) { destroySprite(u); ufos.splice(i, 1); continue; }
            if (now - u.lastShootTime > u.shootInterval) { shootUFOBullet(u.x, u.y); u.lastShootTime = now; }

            let ufoHit = false;
            for (let j = bullets.length - 1; j >= 0; j--) {
                if (isCollidingFast(bullets[j], u, 30)) {
                    explodeAt(u.x, u.y);
                    destroySprite(u); destroySprite(bullets[j]);
                    ufos.splice(i, 1); bullets.splice(j, 1);
                    score++; ui.scoreText.text = `Punkte: ${score}`;
                    ufoHit = true;
                    break;
                }
            }

            // تجنب حساب تصادم الـ UFO مع الصاروخ إذا جرى تدميره برصاصة
            if (ufoHit) continue;

            if (rocket && isCollidingFast(u, rocket, 35)) {
                explodeAt(rocket.x, rocket.y); destroySprite(rocket); rocket = null; gameRunning = false; endLevel(false); return;
            }
        }

        for (let i = explosions.length - 1; i >= 0; i--) {
            const e = explosions[i];
            e.sprite.scale.x += 0.08; e.sprite.scale.y += 0.08; e.sprite.alpha -= 0.08; e.life--;
            if (e.life <= 0 || e.sprite.alpha <= 0) { destroySprite(e.sprite); explosions.splice(i, 1); }
        }

        if (++ufoTimer > (isMobileScreen ? 50 : 65)) { spawnUFO(); ufoTimer = 0; }

        const elapsedSec = Math.floor((now - levelStartTime) / 1000);
        const level = LEVELS[levelIndex];
        const remaining = level.durationSec - elapsedSec;
        ui.timerText.text = `Zeit: ${remaining > 0 ? remaining : 0}s`;

        if (score >= level.target || remaining <= 0) { endLevel(score >= level.target); }
    });

    // === إعدادات التاتش والـ Joystick للموبايل ===
    (function setupTouch() {
      const joyContainer = document.getElementById('joystick-container'), joyStick = document.getElementById('joystick-stick'), fireBtn = document.getElementById('pubg-fire-btn');
      let isJoyActive = false, joyTouchId = null, fireInterval = null;
      const maxRadius = (joyContainer.clientWidth / 2) - (joyStick.clientWidth / 2) - 5;

      function handleJoyMove(cX, cY) {
        const rect = joyContainer.getBoundingClientRect();
        let dX = cX - (rect.left + rect.width / 2), dY = cY - (rect.top + rect.height / 2);
        const dist = Math.hypot(dX, dY);
        if (dist > maxRadius) { dX = (dX / dist) * maxRadius; dY = (dY / dist) * maxRadius; }
        joyStick.style.transform = `translate(calc(-50% + ${dX}px), calc(-50% + ${dY}px))`;
        keys["ArrowLeft"] = dX < -10; keys["ArrowRight"] = dX > 10;
        keys["ArrowUp"] = dY < -10; keys["ArrowDown"] = dY > 10;
      }

      function resetJoy() {
        isJoyActive = false; joyTouchId = null; joyStick.style.transform = 'translate(-50%, -50%)';
        keys["ArrowLeft"] = keys["ArrowRight"] = keys["ArrowUp"] = keys["ArrowDown"] = false;
      }

      joyContainer.addEventListener('pointerdown', e => { isJoyActive = true; joyTouchId = e.pointerId; handleJoyMove(e.clientX, e.clientY); });
      joyContainer.addEventListener('pointermove', e => { if (isJoyActive && e.pointerId === joyTouchId) handleJoyMove(e.clientX, e.clientY); });
      joyContainer.addEventListener('pointerup', resetJoy); joyContainer.addEventListener('pointercancel', resetJoy);

      function stopFire() {
        if (fireInterval) { clearInterval(fireInterval); fireInterval = null; }
      }

      fireBtn.addEventListener('pointerdown', e => {
        e.preventDefault(); stopFire();
        shootBullet();
        if (navigator.vibrate) navigator.vibrate(20);
        fireInterval = setInterval(shootBullet, 200);
      });
      fireBtn.addEventListener('pointerup', stopFire); fireBtn.addEventListener('pointercancel', stopFire);
    })();
  </script>
</body>
</html>
