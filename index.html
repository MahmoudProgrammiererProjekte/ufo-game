<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Raketen-Spiel</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0b2233;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }

    /* === واجهة التحكم بأسلوب PUBG Mobile === */
    #mobile-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* للسماح باللمس فقط للقطع التفاعلية */
      z-index: 100;
    }

    /* عصا التحكم اليسرى (Joystick Area) */
    #joystick-container {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
      backdrop-filter: blur(2px);
    }

    #joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    /* زر إطلاق النار الأيمن (PUBG Fire Button) */
    #pubg-fire-btn {
      position: absolute;
      bottom: 50px;
      right: 40px;
      width: 85px;
      height: 85px;
      background: radial-gradient(circle, rgba(235, 59, 90, 0.9) 0%, rgba(193, 15, 47, 0.9) 100%);
      border: 3px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      color: white;
      font-size: 20px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: manipulation;
      box-shadow: 0 4px 15px rgba(229, 45, 39, 0.5);
      letter-spacing: 1px;
    }

    #pubg-fire-btn:active {
      transform: scale(0.92);
      background: radial-gradient(circle, rgba(193, 15, 47, 1) 0%, rgba(130, 0, 20, 1) 100%);
    }

    /* إخفاء الواجهة على الكمبيوتر */
    @media (min-width: 768px) { 
      #mobile-hud { display: none; } 
    }
  </style>
</head>
<body>

  <!-- طبقة التحكم (HUD) -->
  <div id="mobile-hud">
    <!-- الـ Joystick للتحكم بالاتجاهات -->
    <div id="joystick-container">
      <div id="joystick-stick"></div>
    </div>

    <!-- زر النار بأسلوب بوبجي -->
    <div id="pubg-fire-btn">FEUER</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
  
  <!-- تعطيل إطلاق نار الأعداء UFO -->
  <script>
    const originalSetInterval = window.setInterval;
    window.setInterval = function(fn, delay, ...args) {
      const fnStr = fn.toString();
      if (fnStr.includes('enemy') || fnStr.includes('ufo') || fnStr.includes('shoot') || fnStr.includes('bullet')) {
        if (!fnStr.includes('rocket') && !fnStr.includes('player')) {
          return null;
        }
      }
      return originalSetInterval(fn, delay, ...args);
    };
  </script>

  <script src="app.js"></script>

  <!-- برمجة التحكم بالـ Joystick وزر النار محاكاةً للكيبورد -->
  <script>
    (function() {
      // حالة المفاتيح المُحاكاة
      const keyStates = {
        ArrowLeft: false,
        ArrowRight: false,
        ArrowUp: false,
        ArrowDown: false,
        Space: false
      };

      function setKey(key, state) {
        if (keyStates[key] !== state) {
          keyStates[key] = state;
          const eventType = state ? 'keydown' : 'keyup';
          const event = new KeyboardEvent(eventType, {
            key: key === 'Space' ? ' ' : key,
            code: key,
            bubbles: true
          });
          window.dispatchEvent(event);
        }
      }

      // === 1. برمجة الـ Joystick ===
      const joyContainer = document.getElementById('joystick-container');
      const joyStick = document.getElementById('joystick-stick');
      let isJoyActive = false;
      let joyTouchId = null;

      const maxRadius = 40; // أقصى مسافة تحرك للزر من المركز

      function handleJoyMove(clientX, clientY) {
        const rect = joyContainer.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let deltaX = clientX - centerX;
        let deltaY = clientY - centerY;

        const distance = Math.hypot(deltaX, deltaY);

        if (distance > maxRadius) {
          deltaX = (deltaX / distance) * maxRadius;
          deltaY = (deltaY / distance) * maxRadius;
        }

        joyStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

        // تحويل الحركة لضغطات أسهم
        const threshold = 12;
        setKey('ArrowLeft', deltaX < -threshold);
        setKey('ArrowRight', deltaX > threshold);
        setKey('ArrowUp', deltaY < -threshold);
        setKey('ArrowDown', deltaY > threshold);
      }

      function resetJoy() {
        isJoyActive = false;
        joyTouchId = null;
        joyStick.style.transform = 'translate(-50%, -50%)';
        setKey('ArrowLeft', false);
        setKey('ArrowRight', false);
        setKey('ArrowUp', false);
        setKey('ArrowDown', false);
      }

      joyContainer.addEventListener('pointerdown', (e) => {
        isJoyActive = true;
        joyTouchId = e.pointerId;
        joyContainer.setPointerCapture(e.pointerId);
        handleJoyMove(e.clientX, e.clientY);
      });

      joyContainer.addEventListener('pointermove', (e) => {
        if (isJoyActive && e.pointerId === joyTouchId) {
          handleJoyMove(e.clientX, e.clientY);
        }
      });

      joyContainer.addEventListener('pointerup', resetJoy);
      joyContainer.addEventListener('pointercancel', resetJoy);


      // === 2. برمجة زر النار (FEUER) ===
      const fireBtn = document.getElementById('pubg-fire-btn');

      const startFire = (e) => {
        e.preventDefault();
        setKey('Space', true);
        if (navigator.vibrate) navigator.vibrate(20); // اهتزاز لمسي خفيف
      };

      const stopFire = (e) => {
        e.preventDefault();
        setKey('Space', false);
      };

      fireBtn.addEventListener('pointerdown', startFire);
      fireBtn.addEventListener('pointerup', stopFire);
      fireBtn.addEventListener('pointerleave', stopFire);
      fireBtn.addEventListener('pointercancel', stopFire);

      // === 3. حظر طلقات UFO المستمرة ===
      window.addEventListener('load', () => {
        if (window.app && window.app.ticker) {
          window.app.ticker.add(() => {
            if (window.enemyBullets && Array.isArray(window.enemyBullets)) {
              window.enemyBullets.forEach(b => { if(b) b.visible = false; });
              window.enemyBullets.length = 0;
            }
          });
        }
      });

    })();
  </script>
</body>
</html>
