<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Raketen-Spiel</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0b2233;
      touch-action: none; /* منع الزوم والتمرير */
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }

    /* لوحة المعلومات باللغة الألمانية في الأعلى */
    #touch-info {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- نص إرشادي بالألماني على الشاشة -->
  <div id="touch-info">
    🚀 Touch & Halten zum Steuern und Feuern
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
  <script src="app.js"></script>

  <!-- كود التحكم باللمس المباشر والألماني -->
  <script>
    (function() {
      // محاكاة إشارات الكيبورد لـ app.js
      const activeKeys = {
        ArrowLeft: false,
        ArrowRight: false,
        ArrowUp: false,
        ArrowDown: false,
        Space: false
      };

      function updateKey(key, state) {
        if (activeKeys[key] !== state) {
          activeKeys[key] = state;
          const eventType = state ? 'keydown' : 'keyup';
          const event = new KeyboardEvent(eventType, {
            key: key === 'Space' ? ' ' : key,
            code: key,
            bubbles: true
          });
          window.dispatchEvent(event);
        }
      }

      function clearAllKeys() {
        Object.keys(activeKeys).forEach(key => updateKey(key, false));
      }

      let touchStartX = 0;
      let touchStartY = 0;
      let isTouching = false;

      // عند بدء اللمس
      window.addEventListener('pointerdown', (e) => {
        isTouching = true;
        touchStartX = e.clientX;
        touchStartY = e.clientY;
        // إطلاق النار بمجرد اللمس
        updateKey('Space', true);
      });

      // عند سحب الأصبع على الشاشة
      window.addEventListener('pointermove', (e) => {
        if (!isTouching) return;

        const deltaX = e.clientX - touchStartX;
        const deltaY = e.clientY - touchStartY;
        const threshold = 10; // حساسية اللمس

        // الاتجاه الأفقي (يمين / يسار)
        if (deltaX < -threshold) {
          updateKey('ArrowLeft', true);
          updateKey('ArrowRight', false);
        } else if (deltaX > threshold) {
          updateKey('ArrowRight', true);
          updateKey('ArrowLeft', false);
        } else {
          updateKey('ArrowLeft', false);
          updateKey('ArrowRight', false);
        }

        // الاتجاه العمودي (فوق / تحت)
        if (deltaY < -threshold) {
          updateKey('ArrowUp', true);
          updateKey('ArrowDown', false);
        } else if (deltaY > threshold) {
          updateKey('ArrowDown', true);
          updateKey('ArrowUp', false);
        } else {
          updateKey('ArrowUp', false);
          updateKey('ArrowDown', false);
        }
      });

      // عند رفع الأصبع
      const stopTouch = () => {
        isTouching = false;
        clearAllKeys();
      };

      window.addEventListener('pointerup', stopTouch);
      window.addEventListener('pointercancel', stopTouch);
    })();
  </script>
</body>
</html>
