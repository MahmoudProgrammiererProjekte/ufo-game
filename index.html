<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Raketen-Spiel</title>
  <style>
    /* إعدادات الشاشة الأساسية لمنع التمرير */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0b2233;
      touch-action: none; /* يمنع السحب العشوائي للموبايل */
      user-select: none;
      -webkit-user-select: none;
    }
    
    /* وضع الكانفاس خلف الواجهة */
    canvas { 
      display: block; 
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* === واجهة التحكم الثابتة للموبايل === */
    #mobile-hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* يسمح بمرور اللمس للعبة إلا في مناطق الأزرار */
      z-index: 9999; /* ضمان بقاء الأزرار فوق اللعبة دائماً */
    }

    /* Joystick دائرة القاعدة */
    #joystick-container {
      position: absolute;
      bottom: 40px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.1);
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    /* Joystick العصا المتحركة */
    #joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      pointer-events: none; /* لضمان عدم سرقة اللمس من القاعدة */
    }

    /* زر النار */
    #pubg-fire-btn {
      position: absolute;
      bottom: 40px;
      right: 25px;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(235, 59, 90, 0.95) 0%, rgba(193, 15, 47, 0.95) 100%);
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      color: white;
      font-size: 16px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
      box-shadow: 0 4px 20px rgba(229, 45, 39, 0.7);
    }

    #pubg-fire-btn:active {
      transform: scale(0.9);
      background: radial-gradient(circle, rgba(193, 15, 47, 1) 0%, rgba(130, 0, 20, 1) 100%);
    }

    /* إخفاء الواجهة للشاشات الكبيرة (كمبيوتر) */
    @media (min-width: 1025px) { 
      #mobile-hud { display: none; } 
    }
  </style>
</head>
<body>

  <!-- واجهة عناصر التحكم للموبايل -->
  <div id="mobile-hud">
    <div id="joystick-container">
      <div id="joystick-stick"></div>
    </div>
    <div id="pubg-fire-btn">FEUER</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>

  <script>
    const app = new PIXI.Application({
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: 0x0b2233,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
    });
    document.body.appendChild(app.view);

    // التحقق من حجم الشاشة لضبط أحجام العناصر تلقائياً
    let isMobileScreen = window.innerWidth <= 768;
    
    function resizeCanvas() {
        app.renderer.resize(window.innerWidth, window.innerHeight);
        isMobileScreen = window.innerWidth <= 768;
    }
    window.addEventListener("resize", resizeCanvas);

    // نسب التصغير: تعطي أحجام مثالية للهاتف والكمبيوتر
    function getScale(baseScale) {
        return isMobileScreen ? baseScale * 0.65 : baseScale;
    }

    const ASSETS = {
        rocket: "rocket.png",
        bullet: "bullet.png",
        ufo1: "ufo1.png",
        ufo2: "ufo2.png",
        explosionSound: "explosion.mp3",
        hitSound: "hit.mp3",
        shootSound: "shoot.mp3"
    };

    const audio = {
        explosion: new Audio(ASSETS.explosionSound),
        hit: new Audio(ASSETS.hitSound),
        shoot: new Audio(ASSETS.shootSound)
    };
    function playSound(s) { try { s.currentTime = 0; s.play().catch(()=>{}); } catch(e){} }

    let rocket = null;
    let bullets = [], ufos = [], ufoBullets = [], explosions = [];
    let keys = {}, gameRunning = false, ufoTimer = 0;

    let score = 0;
    let levelIndex = 0;
    const LEVELS = [
        { target: 30, durationSec: 60 },
        { target: 60, durationSec: 90 },
        { target: 90, durationSec: 120 }
    ];
    let levelStartTime = 0;

    const ui = {
        scoreText: new PIXI.Text("", { fill: "white", fontSize: 18, fontWeight: "bold" }),
        levelText: new PIXI.Text("", { fill: "yellow", fontSize: 18, fontWeight: "bold" }),
        timerText: new PIXI.Text("", { fill: "lightgreen", fontSize: 18, fontWeight: "bold" }),
        messageText: new PIXI.Text("", { fill: "red", fontSize: 26, fontWeight: "bold" })
    };

    ui.scoreText.x = 10; ui.scoreText.y = 10;
    ui.levelText.x = 10; ui.levelText.y = 35;
    ui.timerText.x = 10; ui.timerText.y = 60;
    ui.messageText.anchor = { x: 0.5, y: 0.5 };
    ui.messageText.x = app.screen.width / 2; ui.messageText.y = 120;
    app.stage.addChild(ui.scoreText, ui.levelText, ui.timerText, ui.messageText);

    function random(min, max) { return Math.floor(Math.random() * (max - min + 1) + min); }

    function createButton(text, x, y, w, h, onClick) {
        const c = new PIXI.Container();
        const g = new PIXI.Graphics();
        g.beginFill(0x3333aa).drawRoundedRect(0, 0, w, h, 12).endFill();
        g.interactive = true; g.buttonMode = true;
        g.on("pointerdown", onClick);
        c.addChild(g);
        const t = new PIXI.Text(text, { fill: "white", fontSize: 18, fontWeight: "bold" });
        t.x = w / 2 - t.width / 2; t.y = h / 2 - t.height / 2;
        c.addChild(t);
        c.x = x - w / 2; // تمركز الزر
        c.y = y - h / 2;
        return c;
    }

    function createRocket() {
        if (rocket && app.stage.children.includes(rocket)) app.stage.removeChild(rocket);
        rocket = PIXI.Sprite.from(ASSETS.rocket);
        rocket.anchor.set(0.5);
        rocket.x = app.screen.width / 2;
        rocket.y = app.screen.height - (isMobileScreen ? 180 : 120); // وضع الصاروخ فوق الأزرار أوتوماتيكياً
        rocket.scale.set(getScale(0.06));
        app.stage.addChild(rocket);
    }

    function shootBullet() {
        if (!gameRunning || !rocket) return;
        const b = PIXI.Sprite.from(ASSETS.bullet);
        b.anchor.set(0.5);
        b.x = rocket.x;
        b.y = rocket.y - rocket.height / 2;
        b.scale.set(getScale(0.04));
        bullets.push(b);
        app.stage.addChild(b);
        playSound(audio.shoot);
    }

    function explodeAt(x, y) {
        const g = new PIXI.Graphics();
        g.beginFill(0xff4444).drawCircle(0, 0, isMobileScreen ? 15 : 20).endFill();
        g.x = x; g.y = y;
        app.stage.addChild(g);
        explosions.push({ sprite: g, life: 20 });
        playSound(audio.explosion);
    }

    function hitFeedback(x, y) {
        const g = new PIXI.Graphics();
        g.beginFill(0xffff66).drawCircle(0, 0, isMobileScreen ? 10 : 15).endFill();
        g.x = x; g.y = y;
        app.stage.addChild(g);
        explosions.push({ sprite: g, life: 10 });
        playSound(audio.hit);
    }

    function spawnUFO() {
        const u = PIXI.Sprite.from(Math.random() < 0.5 ? ASSETS.ufo1 : ASSETS.ufo2);
        u.anchor.set(0.5);
        u.x = random(40, app.screen.width - 40);
        u.y = -40;
        u.scale.set(getScale(0.08)); // حجم مناسب للأعداء
        ufos.push(u);
        app.stage.addChild(u);
    }

    function isColliding(a, b) {
        if (!a || !b) return false;
        const A = a.getBounds(), B = b.getBounds();
        // تقليص صندوق التصادم قليلاً ليكون اللعب أكثر مرونة وعدلاً
        const margin = 10;
        return A.x + margin < B.x + B.width - margin && 
               A.x + A.width - margin > B.x + margin && 
               A.y + margin < B.y + B.height - margin && 
               A.y + A.height - margin > B.y + margin;
    }

    function endLevel(won) {
        gameRunning = false;
        ui.messageText.text = won ? `Erfolg! Level ${levelIndex+1}!` : `Verloren!`;

        const restartBtn = createButton("Neustart", app.screen.width / 2 - 80, app.screen.height / 2 + 30, 140, 50, ()=> {
            if (restartBtn.parent) app.stage.removeChild(restartBtn);
            if (nextBtn.parent) app.stage.removeChild(nextBtn);
            resetGame(0);
        });

        const nextBtn = createButton(won ? "Weiter" : "Wiederholen", app.screen.width / 2 + 80, app.screen.height / 2 + 30, 140, 50, ()=> {
            if (restartBtn.parent) app.stage.removeChild(restartBtn);
            if (nextBtn.parent) app.stage.removeChild(nextBtn);
            if (won) {
                if (levelIndex < LEVELS.length-1) {
                    levelIndex++;
                    resetGame(levelIndex);
                } else {
                    ui.messageText.text = "Gewonnen! 🎉";
                }
            } else {
                resetGame(levelIndex);
            }
        });

        app.stage.addChild(restartBtn, nextBtn);
    }

    function resetGame(startLevel = 0) {
        [bullets, ufos, ufoBullets, explosions].forEach(arr => arr.forEach(obj => {
            const sprite = obj && obj.sprite ? obj.sprite : obj;
            if (sprite && sprite.parent) app.stage.removeChild(sprite);
        }));
        bullets = []; ufos = []; ufoBullets = []; explosions = [];
        keys = {};
        ufoTimer = 0;
        score = 0;
        levelIndex = Math.max(0, Math.min(startLevel, LEVELS.length-1));
        ui.messageText.text = "";
        ui.scoreText.text = `Punkte: ${score}`;
        ui.levelText.text = `Level: ${levelIndex+1} (Ziel: ${LEVELS[levelIndex].target})`;
        startGame();
    }

    function startGame() {
        gameRunning = true;
        createRocket();
        levelStartTime = performance.now();
        ui.scoreText.text = `Punkte: ${score}`;
        ui.levelText.text = `Level: ${levelIndex+1} (Ziel: ${LEVELS[levelIndex].target})`;
    }

    document.addEventListener("keydown", e => keys[e.code] = true);
    document.addEventListener("keyup", e => keys[e.code] = false);

    const startButton = createButton("Spiel Starten", app.screen.width / 2, app.screen.height / 2, 200, 60, () => {
        if (startButton.parent) app.stage.removeChild(startButton);
        startGame();
    });
    app.stage.addChild(startButton);

    // === Game Loop ===
    app.ticker.add(() => {
        if (!gameRunning || !rocket) return;

        // تطبيق حركة الصاروخ
        if (keys["ArrowLeft"]) rocket.x -= 6;
        if (keys["ArrowRight"]) rocket.x += 6;
        if (keys["ArrowUp"]) rocket.y -= 6;
        if (keys["ArrowDown"]) rocket.y += 6;

        // === حدود الشاشة الصارمة (منع الصاروخ من الاختفاء تحت الأزرار) ===
        const paddingX = rocket.width / 2;
        const paddingY = rocket.height / 2;
        const hudHeight = isMobileScreen ? 170 : 50; // مساحة الأزرار السفلية المحمية
        
        const minX = paddingX;
        const maxX = app.screen.width - paddingX;
        const minY = paddingY + 80; // حماية النصوص العلوية
        const maxY = app.screen.height - hudHeight - paddingY; // منع النزول خلف الأزرار

        // إجبار الصاروخ على البقاء داخل هذه الحدود
        rocket.x = Math.max(minX, Math.min(rocket.x, maxX));
        rocket.y = Math.max(minY, Math.min(rocket.y, maxY));

        // الرصاص
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.y -= 12; // تسريع الرصاصة قليلاً لتناسب التصغير
            if (b.y < -20) { if (b.parent) app.stage.removeChild(b); bullets.splice(i, 1); continue; }
        }

        // الأعداء
        for (let i = ufos.length - 1; i >= 0; i--) {
            const u = ufos[i];
            u.y += isMobileScreen ? 2.5 : 3;
            if (u.y > app.screen.height + 40) { if (u.parent) app.stage.removeChild(u); ufos.splice(i, 1); continue; }

            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (isColliding(b, u)) {
                    hitFeedback(u.x, u.y);
                    if (u.parent) app.stage.removeChild(u);
                    if (b.parent) app.stage.removeChild(b);
                    ufos.splice(i, 1);
                    bullets.splice(j, 1);
                    score++;
                    ui.scoreText.text = `Punkte: ${score}`;
                    break;
                }
            }

            if (rocket && isColliding(u, rocket)) {
                explodeAt(rocket.x, rocket.y);
                if (rocket.parent) app.stage.removeChild(rocket);
                gameRunning = false;
                endLevel(false);
                return;
            }
        }

        for (let i = explosions.length - 1; i >= 0; i--) {
            const e = explosions[i];
            e.sprite.scale.x += 0.08;
            e.sprite.scale.y += 0.08;
            if (!e.sprite.alpha) e.sprite.alpha = 1;
            e.sprite.alpha -= 0.04;
            e.life--;
            if (e.life <= 0) { if (e.sprite.parent) app.stage.removeChild(e.sprite); explosions.splice(i, 1); }
        }

        ufoTimer++;
        if (ufoTimer > (isMobileScreen ? 50 : 60)) { spawnUFO(); ufoTimer = 0; }

        const elapsedMs = performance.now() - levelStartTime;
        const elapsedSec = Math.floor(elapsedMs / 1000);
        const level = LEVELS[levelIndex];
        const remaining = level.durationSec - elapsedSec;
        ui.timerText.text = `Zeit: ${remaining > 0 ? remaining : 0}s`;

        if (score >= level.target) { endLevel(true); return; }
        if (remaining <= 0) { endLevel(score >= level.target); return; }
    });

    // === Joystick & Touch Handling ===
    (function setupTouch() {
      const joyContainer = document.getElementById('joystick-container');
      const joyStick = document.getElementById('joystick-stick');
      const fireBtn = document.getElementById('pubg-fire-btn');
      
      let isJoyActive = false;
      let joyTouchId = null;
      
      // حساب أقصى مسافة يمكن للعصا الخروج إليها (منعها من تجاوز القاعدة)
      const maxRadius = (joyContainer.clientWidth / 2) - (joyStick.clientWidth / 2) - 5; 

      function handleJoyMove(clientX, clientY) {
        const rect = joyContainer.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let deltaX = clientX - centerX;
        let deltaY = clientY - centerY;

        const distance = Math.hypot(deltaX, deltaY);

        // إجبار العصا على البقاء داخل الدائرة بدقة رياضية
        if (distance > maxRadius) {
          deltaX = (deltaX / distance) * maxRadius;
          deltaY = (deltaY / distance) * maxRadius;
        }

        joyStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

        const threshold = 10; // مدى حساسية الحركة
        keys["ArrowLeft"] = deltaX < -threshold;
        keys["ArrowRight"] = deltaX > threshold;
        keys["ArrowUp"] = deltaY < -threshold;
        keys["ArrowDown"] = deltaY > threshold;
      }

      function resetJoy() {
        isJoyActive = false;
        joyTouchId = null;
        joyStick.style.transform = 'translate(-50%, -50%)';
        keys["ArrowLeft"] = false;
        keys["ArrowRight"] = false;
        keys["ArrowUp"] = false;
        keys["ArrowDown"] = false;
      }

      joyContainer.addEventListener('pointerdown', (e) => {
        isJoyActive = true;
        joyTouchId = e.pointerId;
        joyContainer.setPointerCapture(e.pointerId);
        handleJoyMove(e.clientX, e.clientY);
      });

      joyContainer.addEventListener('pointermove', (e) => {
        if (isJoyActive && e.pointerId === joyTouchId) {
          handleJoyMove(e.clientX, e.clientY);
        }
      });

      joyContainer.addEventListener('pointerup', resetJoy);
      joyContainer.addEventListener('pointercancel', resetJoy);

      // === زر النار ===
      let fireInterval = null;
      let activeFirePointerId = null;

      function stopFire() {
        if (fireInterval !== null) {
          clearInterval(fireInterval);
          fireInterval = null;
        }
        if (activeFirePointerId !== null && fireBtn.hasPointerCapture(activeFirePointerId)) {
          try { fireBtn.releasePointerCapture(activeFirePointerId); } catch(err){}
        }
        activeFirePointerId = null;
      }

      fireBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();

        stopFire(); // إيقاف أي إطلاق مُعلق
        
        activeFirePointerId = e.pointerId;
        try { fireBtn.setPointerCapture(e.pointerId); } catch(err){}

        shootBullet();
        if (navigator.vibrate) navigator.vibrate(20);
        fireInterval = setInterval(shootBullet, 200);
      });

      fireBtn.addEventListener('pointerup', stopFire);
      fireBtn.addEventListener('pointercancel', stopFire);
      fireBtn.addEventListener('pointerleave', stopFire);
      
      // لتأمين توقف الإطلاق في جميع الحالات
      window.addEventListener('touchend', () => {
        if (fireInterval !== null) stopFire();
      });
    })();
  </script>
</body>
</html>
