<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Rocket Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0b2233;
      touch-action: none; /* منع التكبير والتمرير باللمس */
    }
    canvas { display: block; }

    /* أزرار اللمس للموبايل */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      user-select: none;
      -webkit-user-select: none;
      justify-content: center;
    }
    .btn {
      background: rgba(51, 51, 170, 0.8);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.15s;
    }
    .btn:active { 
      background: #111199; 
      transform: scale(0.9); 
    }

    /* إخفاء الأزرار على أجهزة الكمبيوتر (الشاشات الكبيرة) */
    @media (min-width: 768px) { 
      #controls { display: none; } 
    }
  </style>
</head>
<body>

  <!-- أزرار التحكم -->
  <div id="controls">
    <button class="btn" id="leftBtn">⬅️</button>
    <button class="btn" id="upBtn">⬆️</button>
    <button class="btn" id="downBtn">⬇️</button>
    <button class="btn" id="rightBtn">➡️</button>
    <button class="btn" id="fireBtn">🔥</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
  <script src="app.js"></script>

  <!-- كود ربط اللمس بأسهم الكيبورد مباشرة دون تعديل app.js -->
  <script>
    (function() {
      // خريطة الأزرار والأسهم المقابلة لها
      const keyMap = {
        'leftBtn': 'ArrowLeft',
        'upBtn': 'ArrowUp',
        'downBtn': 'ArrowDown',
        'rightBtn': 'ArrowRight',
        'fireBtn': ' ' // Space للإطلاق
      };

      // محاكاة حدث الضغط
      function simulateKey(key, type) {
        const event = new KeyboardEvent(type, {
          key: key,
          code: key === ' ' ? 'Space' : key,
          bubbles: true
        });
        window.dispatchEvent(event);
      }

      // ربط كل زر بأحداث اللمس والماوس
      Object.keys(keyMap).forEach(id => {
        const btn = document.getElementById(id);
        const key = keyMap[id];

        if (!btn) return;

        // عند بدء الضغط
        const start = (e) => {
          e.preventDefault();
          simulateKey(key, 'keydown');
        };

        // عند ترك الضغط
        const end = (e) => {
          e.preventDefault();
          simulateKey(key, 'keyup');
        };

        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointerleave', end);
        btn.addEventListener('pointercancel', end);
      });
    })();
  </script>
</body>
</html>
